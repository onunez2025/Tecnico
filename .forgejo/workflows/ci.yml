name: CI — SIATC Security Check

# ⚠️ Este repo usa **pnpm**, no npm.
#
# Hasta el 2026-08-20 este flujo hacia `npm ci`, que exige un `package-lock.json` que aqui no
# existe: `packageManager` declara pnpm y lo que hay es `pnpm-lock.yaml`. Resultado, el CI fallaba
# en el primer paso de TODOS los repos desde la migracion a pnpm, y nadie lo veia porque el aspa
# roja solo sale en la lista de repositorios de Forgejo.
#
# Se alinea con el Dockerfile, que ya funciona: Node 22 y pnpm activado con corepack.

on:
  push: {}
  schedule:
    - cron: '0 3 * * 1'   # Lunes 3am UTC — auditoria de dependencias semanal

jobs:
  ci:
    name: Lint · Build · Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # corepack DESPUES de setup-node: activa la version de pnpm que declara
      # `packageManager` en package.json, sin fijarla en dos sitios distintos.
      - name: Activar pnpm
        run: corepack enable

      # @siatc/c4c-client vive en el registro privado de Forgejo, que responde 401 a quien no se
      # autentica. El Dockerfile ya lo resuelve con un argumento de construccion; el CI no hacia
      # nada equivalente, asi que fallaba AQUI en cada push y nunca llegaba a ejecutar ni el lint,
      # ni el build, ni check-security.sh. El aspa roja solo se ve en la lista de repositorios.
      #
      # El token se escribe y se borra en el mismo paso, como en el Dockerfile. El secreto
      # NPM_REGISTRY_TOKEN se crea en Configuracion -> Acciones -> Secretos: token de SOLO LECTURA de
      # paquetes. Si falta, el paso lo dice en claro en vez de dejar un 401 que no explica nada.
      - name: Instalar dependencias
        env:
          NPM_REGISTRY_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
        run: |
          if [ -z "$NPM_REGISTRY_TOKEN" ]; then
            echo "Falta el secreto NPM_REGISTRY_TOKEN: sin el, el registro privado de @siatc responde 401." >&2
            exit 1
          fi
          trap 'rm -f ~/.npmrc' EXIT
          printf '//git.siatc.cloud/api/packages/MT_Ind/npm/:_authToken=%s\n' "$NPM_REGISTRY_TOKEN" > ~/.npmrc
          pnpm install --frozen-lockfile

      - name: C6 — TypeScript / ESLint
        run: pnpm run lint

      - name: C8 — Build (CRÍTICO)
        run: pnpm run build

      - name: C7 — audit high/critical (advertencia)
        run: pnpm audit --audit-level high
        continue-on-error: true

      - name: Chequeo de seguridad completo (check-security.sh)
        run: bash check-security.sh
        env:
          SECURITY_MODE: BLOCK
