<!-- Cursor de texto (I-beam) del ecosistema SIATC — MODO OSCURO.
     Cuerpo #C2C8CF (luminancia 200): se recorta contra el fondo oscuro (#050F1A).
     La barra central va en #4C5F80, invertida respecto a la variante clara.

     viewBox recortado a la tinta (74 16 108 224). El original declaraba un lienzo
     de 256x256 con la tinta ocupando solo 108x224: el 58% del ancho estaba vacio,
     asi que se habria dibujado mucho mas chico de lo declarado.

     12x26 porque el navegador DESCARTA en silencio cualquier cursor mayor a 128x128.
     El punto activo es el CENTRO (6 13), no una esquina: en un I-beam ahi es donde
     cae el cursor de escritura.

     26 de alto y no 32 como la flecha y la mano: esas se apoyan AL LADO del
     contenido, el I-beam se apoya SOBRE el. A 32 tapaba el texto de 14px sobre
     el que se posa. Lo que hace coherente al juego es la paleta y el trazo, no
     que todos midan igual. -->
