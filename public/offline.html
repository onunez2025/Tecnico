<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Technical</title>
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #F7F8FA; color: #1A1C1E; }
        @media (prefers-color-scheme: dark) { body { background: #0B1220; color: #F9FAFB; } .caja { background: #111C2A; border-color: #1E293B; } }
        .caja { max-width: 420px; text-align: center; background: #fff; border: 1px solid #E2E4E9;
                border-radius: 16px; padding: 32px 28px; }
        img { width: 72px; height: 72px; margin-bottom: 16px; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { margin: 0 0 20px; line-height: 1.5; opacity: .8; font-size: 14px; }
        a.boton { display: inline-block; font-weight: 600; color: #fff; background: #4C5F80; text-decoration: none;
                  border-radius: 10px; padding: 10px 20px; }
    </style>
</head>
<body>
    <div class="caja">
        <img src="/icons/icon-192.png" alt="" />
        <h1>Sin conexión</h1>
        <!-- Se dice la verdad: sin red no hay datos ni sesión, así que no se finge una aplicación vacía. -->
        <p>Esta aplicación necesita conexión para consultar tus tickets y registrar tu trabajo. Vuelve a intentarlo cuando tengas red.</p>
        <!-- Un enlace y no un botón: la CSP del servidor (script-src 'self') bloquea los manejadores de eventos en
             línea, y el botón no hacía nada en producción. Volver a «/» pasa otra vez por el service worker, que
             prueba la red primero: si ya hay conexión entra en la aplicación; si no, vuelve a este aviso. -->
        <a class="boton" href="/">Reintentar</a>
    </div>
</body>
</html>
